<style>
/* Layout: página de produto. Faixas de largura total alternando claro/escuro, conteúdo centralizado, números gigantes como protagonistas. */
:root{
  --white:#ffffff; --paper:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --hair:#d2d2d7;
  --night:#000000; --night-2:#161617; --night-ink:#f5f5f7; --night-muted:#a1a1a6;
  --link:#0066cc; --link-night:#2997ff; --todo:#b25000;
  --grad:linear-gradient(90deg,#2997ff 0%,#5e5ce6 55%,#bf5af2 100%);
  --f:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --ease:cubic-bezier(.25,.1,.25,1); --spring:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{background:var(--white);color:var(--ink);font:400 17px/1.47 var(--f);letter-spacing:-.022em;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;font-weight:600}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:6px}
.todo{color:var(--todo);border-bottom:1px dashed currentColor}
.wrap{max-width:980px;margin:0 auto;padding:0 22px}
.grad{padding-right:.06em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* NAV */
nav{position:sticky;top:0;z-index:20;height:48px;background:rgba(251,251,253,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
nav .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
nav .brand{font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:26px;font-size:12px}
nav ul a{color:var(--ink);opacity:.8}
nav ul a:hover{opacity:1;text-decoration:none}
nav ul a[aria-current]{opacity:1;font-weight:600;color:var(--link)}
nav .progress{position:absolute;left:0;bottom:-1px;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(var(--p,0));background:var(--grad);pointer-events:none}
.menu{display:none;width:40px;height:40px;margin-right:-10px;border:0;background:none;color:var(--ink);cursor:pointer;border-radius:10px}
.menu svg{width:20px;height:20px;display:block;margin:auto}
.menu .x-ico,nav.open .menu .bars{display:none}
nav.open .menu .x-ico{display:block}

:root{--out:cubic-bezier(.2,.8,.2,1);--bounce:cubic-bezier(.34,1.56,.64,1)}
nav{transition:background .4s var(--out),box-shadow .4s var(--out)}
nav.scrolled{background:rgba(251,251,253,.94);box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}

/* HERO: texto + demonstração animada do método */
.hero{position:relative;overflow:hidden;isolation:isolate;padding:60px 0 64px;background:var(--white)}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none}
.hero::before{width:760px;height:760px;right:-240px;top:-320px;background:radial-gradient(circle,rgba(41,151,255,.22),transparent 62%)}
.hero::after{width:640px;height:640px;left:-280px;bottom:-360px;background:radial-gradient(circle,rgba(191,90,242,.16),transparent 62%)}
.hero-grid{max-width:1180px;margin:0 auto;padding:0 22px;display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr);gap:52px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:#2997ff;flex:none}
.hero h1{font-size:clamp(48px,6.6vw,88px);line-height:.98;letter-spacing:-.05em;font-weight:700;margin-top:14px}
.ln{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.ln > span{display:inline-block}
.tagline{font-size:clamp(24px,2.8vw,34px);line-height:1.15;letter-spacing:-.03em;font-weight:600;margin-top:16px}
.hl{position:relative;display:inline-block;white-space:nowrap}
.hl svg{position:absolute;left:0;bottom:-.26em;width:100%;height:.42em;overflow:visible}
.hl path{fill:none;stroke:url(#hlg);stroke-width:5;stroke-linecap:round;stroke-dasharray:320;stroke-dashoffset:320}
.lede{font-size:clamp(17px,1.45vw,19px);line-height:1.5;color:var(--muted);max-width:34em;margin-top:24px;letter-spacing:.005em}
.ctas{display:flex;flex-wrap:wrap;gap:12px 24px;margin-top:26px;font-size:17px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--link);color:#fff;border-radius:980px;padding:12px 22px;font-size:17px;transition:transform .35s var(--bounce),background .2s}
.pill:hover{text-decoration:none;background:#0077ed;transform:translateY(-2px)}
.pill svg{width:18px;height:18px;transition:transform .35s var(--bounce)}
.pill:hover svg{transform:translateX(3px)}
.chev::after{content:" ›";font-size:1.15em}
.proof{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 22px;margin-top:32px;padding-top:24px;border-top:1px solid var(--hair)}
.proof div{display:grid;gap:4px;align-content:start}
.proof b{font-size:clamp(24px,2.3vw,30px);font-weight:700;letter-spacing:-.04em;line-height:1.05;justify-self:start;padding-right:.05em;white-space:nowrap;font-variant-numeric:tabular-nums}
.proof span{font-size:13px;color:var(--muted);line-height:1.3}

.demo-wrap{position:relative}
.demo{position:relative;border-radius:28px;padding:20px 20px 92px;background:radial-gradient(120% 120% at 50% 0%,#1b1f2e 0%,#05060a 72%);color:var(--night-ink);box-shadow:0 40px 80px -36px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden}
.demo-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--night-muted)}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--night-ink)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#ff453a}
.acc{margin-top:16px;display:grid;grid-template-columns:40px 1fr auto;gap:10px 12px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px 14px}
.acc .av{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff}
.acc small{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--night-muted)}
.acc b{display:block;font-size:14.5px;font-weight:600}
.acc .pct{font-size:20px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.acc .bar{grid-column:1/-1;height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.acc .bar i{display:block;height:100%;transform-origin:0 50%;transform:scaleX(var(--k,0));background:var(--grad);transition:transform .8s var(--out)}
.dsteps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.dst{display:grid;grid-template-columns:32px 1fr 22px;gap:12px;align-items:center;padding:9px 12px;border-radius:14px;border:1px solid transparent;opacity:.5;transition:background .4s,border-color .4s,opacity .4s,transform .25s var(--out)}
.dst i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f);font-style:normal;border:1.5px solid rgba(255,255,255,.25);transition:background .4s,border-color .4s,color .4s}
.dst b{display:block;font-size:14.5px;font-weight:600}
.dst span{display:block;font-size:12.5px;color:var(--night-muted);line-height:1.35}
.dst .ck{width:22px;height:22px;border-radius:50%;background:#30d158;display:grid;place-items:center;transform:scale(0);transition:transform .45s var(--bounce)}
.dst .ck svg{width:13px;height:13px;color:#fff}
.dst.now{opacity:1;background:rgba(41,151,255,.1);border-color:rgba(41,151,255,.45)}
.dst.now i{border-color:#2997ff;background:#2997ff;color:#fff}
.dst.done{opacity:.95}
.dst.done i{border-color:rgba(48,209,88,.55);color:#30d158}
.dst.done .ck{transform:scale(1)}
.dst.tap{transform:scale(.97)}
.toast{position:absolute;left:20px;right:20px;bottom:18px;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;background:#fff;color:var(--ink);font-size:13.5px;font-weight:600;line-height:1.35;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);transform:translateY(150%);opacity:0;transition:transform .55s var(--bounce),opacity .3s}
.toast.show{transform:none;opacity:1}
.toast .bell{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.toast .bell svg{width:18px;height:18px;transform-origin:50% 10%}
.toast small{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cursor{position:absolute;left:0;top:0;z-index:5;width:22px;height:22px;pointer-events:none;transform:translate(var(--x,110%),var(--y,120%));transition:transform .75s cubic-bezier(.45,.05,.25,1),opacity .3s}
.cursor svg{width:22px;height:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.cursor::after{content:"";position:absolute;left:-8px;top:-8px;width:22px;height:22px;border-radius:50%;border:2px solid #2997ff;opacity:0}
.cursor.click::after{animation:clk .5s ease-out}
.demo-cap{margin-top:12px;font-size:12.5px;color:var(--muted);text-align:center}

/* FAIXA */
.marquee{background:var(--ink);color:#fff;overflow:hidden;padding:16px 0}
.marquee .track{display:flex;width:max-content}
.marquee .set{display:flex;align-items:center;gap:34px;padding-right:34px;font-weight:600;font-size:clamp(17px,1.8vw,22px);letter-spacing:-.02em;white-space:nowrap}
.marquee .set span{display:inline-flex;align-items:center;gap:34px}
.marquee .set span::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--grad)}
.marquee:hover .track{animation-play-state:paused}

/* SEÇÕES */
section{padding:96px 0;scroll-margin-top:48px}
.paper{background:var(--paper)}
.night{background:var(--night);color:var(--night-ink)}
.night a{color:var(--link-night)}
.head{text-align:center;max-width:820px;margin:0 auto 44px}
.head .kicker{font-size:19px;font-weight:600;color:var(--muted);margin-bottom:8px}
.night .head .kicker{color:var(--night-muted)}
.head h2{font-size:clamp(34px,5vw,58px);line-height:1.06;letter-spacing:-.04em}
.head p{font-size:19px;color:var(--muted);margin-top:14px;letter-spacing:.01em}
.night .head p{color:var(--night-muted)}

/* CASES: cartões + janela com a história */
.head .legend{display:flex;justify-content:center;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-size:14px;font-weight:600;letter-spacing:0;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border-radius:980px;background:var(--paper)}
.legend span i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--f);font-style:normal;color:#fff;background:#86868b}
.legend .l3 i{background:var(--grad)}
.legend .l4{color:#1d7a46;background:#eaf7ef}
.legend .l4 i{background:#1d7a46}
.legend b{font-weight:400;color:#b8b8be}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}
.ov{display:grid;grid-auto-rows:max-content;gap:8px;padding:26px 24px 22px;border-radius:22px;background:var(--paper);color:var(--ink);transition:transform .35s var(--out),box-shadow .5s var(--out);will-change:transform}
.ov:hover{text-decoration:none;box-shadow:0 30px 50px -32px rgba(0,0,0,.4)}
.ov small{font-size:13px;font-weight:600;color:var(--muted)}
.ov strong{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.ov b{font-size:42px;line-height:1;font-weight:700;letter-spacing:-.045em;justify-self:start;padding-right:.06em;margin-top:6px}
.ov span{font-size:15px;color:var(--muted);line-height:1.4}
.ov .go{display:inline-flex;align-items:center;gap:6px;color:var(--link);font-weight:600;font-size:14px;padding-top:8px}
.ov .go svg{width:15px;height:15px;transition:transform .35s var(--bounce)}
.ov:hover .go svg{transform:translateX(4px)}
.swipe{display:none;text-align:center;font-size:13px;color:var(--muted);margin-top:2px}
.pending{justify-self:start;font-style:normal;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px dashed #b8b8be;border-radius:980px;padding:3px 10px;margin-top:6px}
.sheet.wide{width:min(780px,100%);padding:34px 34px 26px}
.cm-head .kicker{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted)}
.cm-head .kicker em{font-style:normal;color:#fff;background:var(--grad);border-radius:980px;padding:3px 11px;font-size:13px}
.cm-head h3{font-size:clamp(26px,3.6vw,36px);line-height:1.1;letter-spacing:-.035em;margin-top:12px;padding-right:30px}
.cm-head .title{font-size:17px;color:var(--muted);margin-top:8px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{font-size:13px;color:var(--muted);border:1px solid var(--hair);border-radius:980px;padding:4px 12px}
.cm-stat{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 16px;margin:22px 0 18px;padding:18px 22px;border-radius:20px;background:var(--paper)}
.cm-stat b{font-size:clamp(44px,6vw,64px);line-height:1;font-weight:700;letter-spacing:-.045em;padding-right:.06em}
.cm-stat span{font-size:16px;color:var(--muted);max-width:28ch;line-height:1.35}
.cm-stat b .todo{font-size:inherit;color:var(--todo)}
.story{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.story > li{display:grid;grid-template-columns:34px 1fr;gap:16px;padding:18px 22px 18px 18px;border-radius:18px;background:var(--paper)}
.story i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--f);font-style:normal;color:#fff;background:#86868b}
.story h4{margin:5px 0 6px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.story p,.story li li{font-size:16.5px;line-height:1.55;color:var(--ink);letter-spacing:-.01em}
.story ul{margin:0;padding-left:18px;display:grid;gap:6px}
.story li li::marker{color:#2997ff}
.story .act i{background:var(--grad)}
.story .act h4{color:var(--ink)}
.story > li.res{background:#eaf7ef;box-shadow:inset 0 0 0 1px #c6ead4}
.story .res i{background:#1d7a46}
.story .res h4{color:#1d7a46}
.story .res p{font-weight:500}
.story > li.wait{background:transparent;border:1.5px dashed #c7c7cc}
.story .wait i{background:#c7c7cc}
.story .wait p{color:var(--muted)}
.cm-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--hair);font-size:13px;color:var(--muted)}
.cm-nav button{border:0;background:var(--paper);color:var(--ink);font:600 14px var(--f);padding:9px 16px;border-radius:980px;cursor:pointer;transition:background .2s,transform .3s var(--bounce)}
.cm-nav button:hover{background:#e8e8ed;transform:translateY(-1px)}
.cm-nav button:disabled{opacity:.35;cursor:default;transform:none}
.print-cases{display:none}

/* LINHA DO TEMPO (mais recente primeiro) */
.tl{list-style:none;margin:0 auto;padding:0;max-width:780px;position:relative}
.tl::before{content:"";position:absolute;left:156px;top:12px;bottom:34px;width:2px;background:linear-gradient(#bf5af2,#2997ff);opacity:.5;border-radius:2px;transform-origin:top}
.tl > li{display:grid;grid-template-columns:130px 1fr;column-gap:52px;padding-bottom:28px;position:relative}
.tl > li::before{content:"";position:absolute;left:150px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--night);border:2px solid #2997ff}
.tl > li.last::before{background:#bf5af2;border-color:#bf5af2;box-shadow:0 0 0 6px rgba(191,90,242,.22)}
.tl > li.old{display:none}
.tl.all > li.old{display:grid;animation:fade .6s var(--out) both}
.tl time{text-align:right;font-size:15px;font-weight:600;color:var(--link-night);line-height:1.6}
.tl ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:17px;line-height:1.5;color:var(--night-ink)}
.tl li li::marker{color:var(--night-muted)}
.tl .latest{display:inline-block;margin-bottom:8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--grad);padding:3px 9px;border-radius:980px}
.tl-more{text-align:center;margin-top:4px}
.tl-more button{border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--night-ink);font:600 15px var(--f);padding:10px 20px;border-radius:980px;cursor:pointer;transition:background .2s,transform .3s var(--bounce)}
.tl-more button:hover{background:rgba(255,255,255,.08);transform:translateY(-1px)}

/* COMPETÊNCIAS */
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.skill{background:var(--paper);border-radius:22px;padding:28px 26px 22px;display:flex;flex-direction:column;gap:8px;transition:transform .35s var(--out),box-shadow .5s var(--out);will-change:transform}
.skill:hover{box-shadow:0 24px 44px -28px rgba(0,0,0,.3)}
.skill svg{width:32px;height:32px;color:var(--link);transition:transform .5s var(--bounce)}
.skill:hover svg{transform:scale(1.15) rotate(-6deg)}
.skill h3{font-size:20px;letter-spacing:-.02em}
.skill p{color:var(--muted);font-size:15.5px}
.skill .proof-links{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:auto;padding-top:12px;border-top:1px solid var(--hair);font-size:13px}
.skill .proof-links span{color:var(--muted);flex-basis:100%}
.skill .proof-links a{font-weight:600;border-radius:980px;padding:3px 10px;background:#eef4ff}
.skill .proof-links a:hover{text-decoration:none;background:#e1ecff}

/* CONVERSA */
.talk{position:relative;overflow:hidden;isolation:isolate;text-align:center}
.talk h2{font-size:clamp(36px,5.4vw,60px);line-height:1.05;letter-spacing:-.045em}
.talk p{color:var(--night-muted);font-size:19px;margin:14px auto 0;max-width:30em}
.talk .ctas{justify-content:center;margin-top:30px}
.talk .chev{color:var(--link-night)}
.night .pill{color:#fff}
.ring{position:absolute;z-index:-1;border-radius:50%;border:2px dashed rgba(41,151,255,.55);pointer-events:none}
.ring.a{width:560px;height:560px;right:-180px;top:-240px}
.ring.b{width:400px;height:400px;left:-150px;bottom:-220px;border-color:rgba(191,90,242,.55)}

@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popin{from{opacity:0;transform:translateY(34px) scale(.95)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes glow{to{transform:translate(-90px,70px) scale(1.12)}}
@keyframes glow2{to{transform:translate(80px,-50px) scale(1.08)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(41,151,255,.55)}100%{box-shadow:0 0 0 9px rgba(41,151,255,0)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,69,58,.6)}100%{box-shadow:0 0 0 9px rgba(255,69,58,0)}}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(41,151,255,.55)}100%{box-shadow:0 0 0 10px rgba(41,151,255,0)}}

@keyframes spin{to{transform:rotate(360deg)}}

document.getElementById("foot").innerHTML = `<span>${fmt(d.nome)} · ${fmt(d.empresa)}</span><span>Nomes de clientes e valores contratuais omitidos ou anonimizados por confidencialidade.</span>`;

if (DRAFT) document.body.insertAdjacentHTML("beforeend", '<p class="draft-bar" role="status">Modo rascunho: campos a preencher visíveis</p>');

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Contagem dos números */
const countUp = el => {
  const m = el.dataset.count && el.dataset.count.match(/^(\D*)(\d+)(\D*)$/); if (!m || reduce) return;
  const end = +m[2], t0 = performance.now();
  const tick = t => { const p = Math.min(1, (t - t0) / 1500), v = Math.round(end * (1 - Math.pow(1 - p, 4)));
    el.textContent = m[1] + v.toLocaleString("pt-BR") + m[3]; if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
};

/* Elementos aparecem ao rolar */
(() => {
  const els = document.querySelectorAll(".reveal, [data-count]");
  if (!("IntersectionObserver" in window)) { els.forEach(el => el.classList.add("on")); return; }
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return; io.unobserve(e.target);
    e.target.classList.add("on"); if (e.target.dataset.count) countUp(e.target);
  }), { threshold: .12, rootMargin: "0px 0px -6% 0px" });
  els.forEach(el => { if (!el.closest(".modal")) io.observe(el); });
})();

/* Menu: encolhe ao rolar, barra de progresso e seção atual */
(() => {
  const nav = document.getElementById("nav"), links = [...nav.querySelectorAll('ul a[href^="#"]')];
  const secs = links.map(a => document.querySelector(a.getAttribute("href"))).filter(Boolean);
  let ticking = false;
  const upd = () => {
    const h = document.documentElement.scrollHeight - innerHeight;
    nav.style.setProperty("--p", h > 0 ? Math.min(1, scrollY / h) : 0);
    nav.classList.toggle("scrolled", scrollY > 24);
    const y = scrollY + innerHeight * .35; let cur = null;
    secs.forEach(sec => { if (sec.getBoundingClientRect().top + scrollY <= y) cur = sec; });
    links.forEach(a => { if (cur && a.getAttribute("href") === "#" + cur.id) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current"); });
    ticking = false;
  };
  addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(upd); } }, { passive: true }); upd();
})();

/* Menu no celular */
(() => {
  const nav = document.getElementById("nav"), btn = document.getElementById("menuBtn");
  const set = open => { nav.classList.toggle("open", open); btn.setAttribute("aria-expanded", open); btn.setAttribute("aria-label", open ? "Fechar menu" : "Abrir menu"); };
  btn.addEventListener("click", () => set(!nav.classList.contains("open")));
  nav.querySelectorAll("ul a").forEach(a => a.addEventListener("click", () => set(false)));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && nav.classList.contains("open")) { set(false); btn.focus(); } });
  document.addEventListener("click", e => { if (!nav.contains(e.target)) set(false); });
  matchMedia("(min-width:835px)").addEventListener("change", e => e.matches && set(false));
})();

/* Demonstração do método: a conta de exemplo passa pelas etapas */
(() => {
  const demo = document.getElementById("demo"); if (!demo) return;
  const steps = [...demo.querySelectorAll(".dst")], N = steps.length;
  const cur = document.getElementById("dCur"), toast = document.getElementById("dToast");
  const tS = document.getElementById("dToastS"), tT = document.getElementById("dToastT");
  const pct = document.getElementById("dPct"), bar = document.getElementById("dBar");
  let shown = 0;
  const setPct = p => {
    const from = shown, t0 = performance.now(); shown = p;
    const tick = t => { const k = Math.min(1, (t - t0) / 700); pct.textContent = Math.round(from + (p - from) * (1 - Math.pow(1 - k, 3))) + "%"; if (k < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  };
  const setK = k => {
    steps.forEach((s, i) => s.className = "dst" + (i < k ? " done" : i === k ? " now" : ""));
    bar.style.setProperty("--k", k / N); setPct(Math.round(k / N * 100));
  };
  const say = k => { tS.textContent = `Etapa ${k + 1} de ${N} · ${d.metodo[k].etapa}`; tT.textContent = d.metodo[k].aviso; toast.classList.add("show"); };
  const moveTo = el => {
    const r = el.getBoundingClientRect(), s = demo.getBoundingClientRect();
    cur.style.setProperty("--x", (r.right - s.left - 44) + "px"); cur.style.setProperty("--y", (r.top - s.top + r.height / 2 - 6) + "px");
  };
  const park = () => { cur.style.setProperty("--x", (demo.clientWidth - 40) + "px"); cur.style.setProperty("--y", (demo.clientHeight - 40) + "px"); };
  if (reduce) { setK(3); say(2); cur.style.opacity = 0; return; }
  let timers = [], visible = true, waiting = false;
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const loop = () => {
    timers.forEach(clearTimeout); timers = []; waiting = false;
    toast.classList.remove("show"); setK(0); park();
    steps.forEach((s, k) => {
      const t = 900 + k * 2200;
      at(t, () => { moveTo(s); toast.classList.remove("show"); });
      at(t + 820, () => { cur.classList.remove("click"); void cur.offsetWidth; cur.classList.add("click"); s.classList.add("tap"); });
      at(t + 980, () => { setK(k + 1); say(k); });
    });
    at(900 + N * 2200 + 1800, () => { if (visible) loop(); else waiting = true; });
  };
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; if (visible && waiting) loop(); }).observe(demo);
  requestAnimationFrame(loop);
})();

/* Inclinação suave dos cartões ao passar o mouse */
if (!reduce && matchMedia("(hover:hover) and (pointer:fine)").matches) {
  document.querySelectorAll(".ov, .skill").forEach(el => {
    el.addEventListener("pointermove", e => {
      const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      el.style.transform = `perspective(900px) rotateX(${(-y * 5).toFixed(2)}deg) rotateY(${(x * 6).toFixed(2)}deg) translateY(-3px)`;
    });
    el.addEventListener("pointerleave", () => { el.style.transform = ""; });
  });
}

/* Linha do tempo: semanas anteriores */

/* Janela dos cases */
(() => {
  const modal = document.getElementById("caseModal"), body = document.getElementById("caseBody"), x = document.getElementById("caseClose");
  let last = null, idx = -1;
  const render = i => {
    idx = i; const c = d.cases[i];
    body.innerHTML = `<div class="cm-swap">${caseHTML(c, i, true)}<div class="cm-nav"><button type="button" data-go="-1"${i === 0 ? " disabled" : ""}>‹ Anterior</button><span>Case ${i + 1} de ${d.cases.length}</span><button type="button" data-go="1"${i === d.cases.length - 1 ? " disabled" : ""}>Próximo ›</button></div></div>`;
    body.querySelectorAll("[data-count]").forEach(countUp);
    modal.querySelector(".sheet").scrollTop = 0;
    history.replaceState(null, "", "#case-" + pad(i + 1));
  };
  const open = i => {
    if (!modal.classList.contains("open")) { last = document.activeElement; modal.classList.add("open"); modal.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden"; render(i); x.focus(); }
    else render(i);
  };
  const close = () => {
    modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true"); document.body.style.overflow = "";
    history.replaceState(null, "", location.pathname + location.search + "#cases"); if (last) last.focus();
  };
  const fromHash = h => { const m = /^#case-(\d+)$/.exec(h || ""); const n = m ? +m[1] : 0; return n >= 1 && n <= d.cases.length ? n - 1 : -1; };
  document.addEventListener("click", e => {
    const a = e.target.closest('a[href^="#case-"]'); if (!a) return;
    const i = fromHash(a.getAttribute("href")); if (i < 0) return;
    e.preventDefault(); open(i);
  });
  body.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b && !b.disabled) render(idx + +b.dataset.go); });
  x.addEventListener("click", close);
  modal.addEventListener("click", e => { if (e.target === modal) close(); });
  document.addEventListener("keydown", e => {
    if (!modal.classList.contains("open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowRight" && idx < d.cases.length - 1) render(idx + 1);
    if (e.key === "ArrowLeft" && idx > 0) render(idx - 1);
  });
  addEventListener("hashchange", () => { const i = fromHash(location.hash); if (i >= 0) open(i); });
  const start = fromHash(location.hash); if (start >= 0) open(start);
})();

/* Pop-up "o que fiz" na trajetória */
(() => {
  const modal = document.getElementById("jobModal"), body = document.getElementById("jobBody");
  let last = null;
  const open = (i, edu) => {
    const t = edu ? d.sobre.formacao[i] : d.sobre.trajetoria[i]; last = document.activeElement;
    body.innerHTML = `<div class="sheet-head"><span class="lg">${t.logo ? `<img src="${esc(logoSrc(t.logo))}" alt="">` : esc(initials(t.local))}</span>
      <div><h3 id="jobTitle">${fmt(edu ? t.titulo : t.cargo)}</h3><p>${fmt(t.local)}${t.periodo ? ` · ${fmt(t.periodo)}` : ""}</p></div></div>
      ${t.numeros ? `<div class="sheet-stats n${t.numeros.length}">${t.numeros.map(n => `<div><b class="grad"${counter(n.valor)}>${fmt(n.valor)}</b><span>${fmt(n.rotulo)}</span></div>`).join("")}</div>` : ""}
      ${t.etapas ? `<h4>Progressão</h4><ul>${t.etapas.map(e => `<li>${fmt(e.cargo)} · <span style="color:var(--muted)">${fmt(e.periodo)}</span></li>`).join("")}</ul>` : ""}
      <h4>${edu ? "O que aprendi" : "O que fiz"}</h4><ul>${(edu ? t.aprendizados : t.atividades).map(a => `<li>${fmt(a)}</li>`).join("")}</ul>
      ${t.pagina ? `<a class="sheet-link" href="${esc(t.pagina)}">Ver tudo o que estou aprendendo ›</a>` : ""}`;
    modal.classList.add("open"); modal.setAttribute("aria-hidden", "false");
    body.querySelectorAll("[data-count]").forEach(countUp);
    document.getElementById("jobClose").focus();
  };
  const close = () => { modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true"); if (last) last.focus(); };
  document.querySelectorAll("li[data-job], li[data-edu]").forEach(li => {
    const go = () => li.dataset.edu !== undefined ? open(+li.dataset.edu, true) : open(+li.dataset.job, false);
    li.addEventListener("click", go);
    li.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
  document.getElementById("jobClose").addEventListener("click", close);
  modal.addEventListener("click", e => { if (e.target === modal) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && modal.classList.contains("open")) close(); });
})();
</script>
