<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Humberto Anastácio</title>
<meta name="description" content="Humberto Anastácio: jovem empreendedor com vendas correndo no sangue. Criador do Smart Balcão, Account Manager parceiro Cisco e aluno de MBA no Mackenzie.">
<link rel="canonical" href="https://humbertoanastacio.github.io/links/">
<meta property="og:type" content="profile">
<meta property="og:locale" content="pt_BR">
<meta property="og:url" content="https://humbertoanastacio.github.io/links/">
<meta property="og:title" content="Humberto Anastácio">
<meta property="og:description" content="Filho do comércio, criador do Smart Balcão e vendedor de tecnologia. Minha história, o que faço hoje e o que curto além do trabalho.">
<meta property="og:image" content="https://humbertoanastacio.github.io/fotos/humberto.jpg">
<meta property="og:image:width" content="400">
<meta property="og:image:height" content="400">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232997ff'/%3E%3Cstop offset='.55' stop-color='%235e5ce6'/%3E%3Cstop offset='1' stop-color='%23bf5af2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='27' font-weight='700' fill='%23fff'%3EHA%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Página pessoal para o link da bio do Instagram: versão preta, feita para o celular */
:root{
  --bg:#000000; --card:#141416; --soft:#222226; --ink:#f5f5f7; --muted:#a1a1a6; --hair:#2c2c30;
  --blue:#2997ff; --link:#2997ff; --todo:#ff9f0a; --todo-bg:rgba(255,159,10,.14); --btn:#f5f5f7; --btn-ink:#000000;
  --grad:linear-gradient(90deg,#2997ff 0%,#5e5ce6 55%,#bf5af2 100%);
  --f:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --out:cubic-bezier(.2,.8,.2,1); --bounce:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--f);letter-spacing:-.015em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p{margin:0}
a{color:var(--link);text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:10px}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}
.todo{color:var(--todo);background:var(--todo-bg);border-bottom:1.5px dashed currentColor;border-radius:4px;padding:0 3px}

.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg::before,.bg::after{content:"";position:absolute;border-radius:50%}
.bg::before{width:560px;height:560px;right:-220px;top:-240px;background:radial-gradient(circle,rgba(41,151,255,.3),transparent 62%)}
.bg::after{width:520px;height:520px;left:-260px;top:38%;background:radial-gradient(circle,rgba(191,90,242,.22),transparent 62%)}

main{max-width:520px;margin:0 auto;padding-block:48px calc(72px + env(safe-area-inset-bottom, 0px));padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px))}
section{margin-top:44px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}

/* OI */
.hi{text-align:center;display:grid;justify-items:center;margin-top:0}
.photo{position:relative;width:132px;height:132px;border-radius:50%;padding:5px;display:grid;place-items:center}
.photo::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#2997ff,#5e5ce6,#bf5af2,#2997ff)}
.photo .in{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--card);display:grid;place-items:center;border:4px solid var(--bg)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{display:grid;justify-items:center;gap:2px;font-size:38px;font-weight:700;letter-spacing:-.04em;color:var(--ink)}
.photo .ph small{font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--todo)}
.hi h1{margin-top:20px;font-size:clamp(28px,8vw,34px);line-height:1.08;letter-spacing:-.045em;font-weight:700}
.nw-name{white-space:nowrap}
.wave{display:inline-block;transform-origin:70% 80%}
.rot{margin-top:10px;font-size:21px;font-weight:600;letter-spacing:-.025em;line-height:1.3;min-height:2.6em;max-width:22ch;text-wrap:balance}
.rot .word{display:inline-block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}
.rot .word.swap{animation:swap .5s var(--out)}
.hi .intro{margin-top:12px;font-size:18px;line-height:1.5;color:var(--muted);max-width:30ch}

/* HOJE */
.today{background:var(--card);border-radius:24px;padding:24px 22px;box-shadow:inset 0 0 0 1px var(--hair);position:relative;overflow:hidden}
.today::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad)}
.today p{font-size:20px;line-height:1.4;font-weight:600;letter-spacing:-.025em}
.today .where{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.today .where span{font-size:13px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:980px;padding:4px 11px}

/* PROJETO PESSOAL */
.proj{position:relative;display:grid;gap:12px;padding:24px 22px 22px;border-radius:24px;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#d7191c,#ffc72c) border-box;border:1.5px solid transparent;overflow:hidden}
.proj::after{content:"";position:absolute;width:260px;height:260px;right:-120px;top:-130px;border-radius:50%;background:radial-gradient(circle,rgba(215,25,28,.28),transparent 65%);pointer-events:none}
.proj .tag{justify-self:start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#ffc72c;background:rgba(255,199,44,.12);border:1px solid rgba(255,199,44,.35);border-radius:980px;padding:3px 10px}
.proj h3{font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.proj p{font-size:15.5px;line-height:1.5;color:var(--muted)}
.proj .why{color:var(--ink);font-weight:500}
.btn.sb{background:#d7191c;color:#fff;position:relative;overflow:hidden}
.btn.sb::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);pointer-events:none}
.today,.nw,.fc{background-image:radial-gradient(260px circle at var(--mx,-999px) var(--my,-999px),rgba(41,151,255,.16),transparent 62%)}
.hi h1 .ch{display:inline-block}
.fc .em{display:inline-block;justify-self:start}

/* TRAJETÓRIA: destaques + visualizador de stories */
.hl-row{display:flex;justify-content:space-between;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px;scrollbar-width:none}
.hl-row::-webkit-scrollbar{display:none}
.hl{flex:none;display:grid;justify-items:center;gap:6px;width:64px;border:0;background:none;color:var(--ink);cursor:pointer;padding:0;font:inherit}
.hl .ring{width:62px;height:62px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,var(--c),#bf5af2,var(--c));display:grid;place-items:center;transition:transform .35s var(--bounce)}
.hl .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff;border:3px solid var(--bg)}
.hl:hover .ring,.hl:focus-visible .ring{transform:scale(1.07)}
.hl .nm{font-size:11.5px;font-weight:600;color:var(--muted);max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.trj{margin-top:6px;width:100%;background:var(--grad);color:#fff;font-size:17px}
.trj-play{width:0;height:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
.sv{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.sv[hidden]{display:none!important}
.sv-frame{position:relative;width:min(100vw,440px);height:min(100%,820px);height:min(100dvh,820px);border-radius:18px;overflow:hidden;background:#111;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.sv-media{position:absolute;inset:0;background:var(--sv-bg,#222)}
.sv-media img{width:100%;height:100%;object-fit:cover;display:block}
.sv-media .sv-logo{position:absolute;left:50%;top:34%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:32px;overflow:hidden;background:#fff;box-shadow:0 24px 50px -18px rgba(0,0,0,.6)}
.sv-media .sv-logo img{width:100%;height:100%;object-fit:cover}
.sv-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,transparent 22%,transparent 40%,rgba(0,0,0,.85) 100%)}
.sv-bars{position:absolute;top:10px;left:10px;right:10px;z-index:3;display:flex;gap:4px}
.sv-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.sv-bars b{display:block;height:100%;background:#fff;transform-origin:0 50%;transform:scaleX(0)}
.sv-bars i.done b{transform:none}
.sv-bars i.cur b{animation:fillbar var(--t,6s) linear forwards}
.sv-frame.paused .sv-bars i.cur b{animation-play-state:paused}
.sv-head{position:absolute;top:22px;left:12px;right:8px;z-index:4;display:flex;align-items:center;gap:10px}
.sv-av{width:36px;height:36px;border-radius:50%;overflow:hidden;background:#fff;flex:none;border:2px solid rgba(255,255,255,.8)}
.sv-av img{width:100%;height:100%;object-fit:cover}
.sv-who{display:grid;line-height:1.2;min-width:0}
.sv-who b{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-who small{font-size:12.5px;opacity:.8}
.sv-x{margin-left:auto;width:40px;height:40px;border:0;border-radius:50%;background:rgba(0,0,0,.25);color:#fff;font-size:26px;line-height:1;cursor:pointer;position:relative;z-index:5}
.sv-body{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 22px 34px;display:grid;gap:8px}
.sv-body .cg{justify-self:start;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:4px 10px;border-radius:980px}
.sv-body h3{font-size:28px;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.sv-body p{font-size:16px;line-height:1.5;color:rgba(255,255,255,.88)}
.sv-body .st{justify-self:start;display:flex;align-items:baseline;gap:8px;margin-top:6px;background:#fff;color:#111;border-radius:14px;padding:8px 14px;transform:rotate(-2deg);box-shadow:0 12px 26px -12px rgba(0,0,0,.6)}
.sv-body .st b{font-size:24px;font-weight:800;letter-spacing:-.04em}
.sv-body .st span{font-size:13px;font-weight:600}
.sv-nav{position:absolute;inset:70px 0 0 0;z-index:2;display:grid;grid-template-columns:1fr 2fr}
.sv-nav button{border:0;background:transparent;cursor:pointer;padding:0}
.sv-anim .sv-body > *{animation:up .5s var(--out) both}
.sv-anim .sv-body > :nth-child(2){animation-delay:.06s}.sv-anim .sv-body > :nth-child(3){animation-delay:.12s}.sv-anim .sv-body > :nth-child(4){animation-delay:.2s}
.sv-anim .sv-logo{animation:pop .6s var(--bounce) both}
@media (max-width:520px){.sv-frame{width:100vw;height:100%;border-radius:0}}

/* HISTÓRIA EM STORIES */
.stories{position:relative;border-radius:24px;overflow:hidden;background:var(--card);box-shadow:inset 0 0 0 1px var(--hair);user-select:none;-webkit-user-select:none}
.sbars{position:absolute;top:12px;left:14px;right:14px;z-index:3;display:flex;gap:4px}
.sbars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.sbars b{display:block;height:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}
.sbars i.done b{transform:none}
.sbars i.cur b{animation:fillbar var(--t,5s) linear forwards}
.sbars.paused i.cur b{animation-play-state:paused}
.strack{display:grid}
.slide{grid-area:1/1;display:grid;align-content:end;gap:6px;min-height:270px;padding:44px 22px 24px;opacity:0;transform:translateX(18px);transition:opacity .45s var(--out),transform .55s var(--out);pointer-events:none}
.slide.on{opacity:1;transform:none}
.slide:nth-child(1){background:radial-gradient(120% 90% at 100% 0%,rgba(255,159,10,.22),transparent 60%)}
.slide:nth-child(2){background:radial-gradient(120% 90% at 100% 0%,rgba(41,151,255,.25),transparent 60%)}
.slide:nth-child(3){background:radial-gradient(120% 90% at 100% 0%,rgba(94,92,230,.28),transparent 60%)}
.slide:nth-child(4){background:radial-gradient(120% 90% at 100% 0%,rgba(191,90,242,.28),transparent 60%)}
.slide .em{font-size:44px;line-height:1;margin-bottom:6px}
.slide time{font-size:13px;font-weight:600;color:var(--blue)}
.slide h3{font-size:23px;font-weight:700;letter-spacing:-.035em;line-height:1.15}
.slide p{font-size:15.5px;line-height:1.5;color:var(--muted)}
.snav{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:1fr 2fr}
.snav button{border:0;background:transparent;cursor:pointer;padding:0}
.snav button:focus-visible{outline:2px solid var(--blue);outline-offset:-4px;border-radius:20px}
.shint{margin-top:10px;font-size:13px;color:var(--muted);text-align:center}

/* HISTÓRIA */
.story{list-style:none;margin:0;padding:0 0 0 30px;position:relative;display:grid;gap:18px}
.story::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;border-radius:2px;background:linear-gradient(#2997ff,#bf5af2);transform-origin:top}
.story li{position:relative}
.story li::before{content:"";position:absolute;left:-27px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid #2997ff}
.story li:last-child::before{background:#bf5af2;border-color:#bf5af2;box-shadow:0 0 0 5px rgba(191,90,242,.18)}
.story time{font-size:13px;font-weight:600;color:var(--blue)}
.story h3{font-size:18px;font-weight:600;letter-spacing:-.02em;margin-top:1px}
.story p{font-size:15.5px;color:var(--muted);margin-top:3px;line-height:1.45}

/* PERGUNTAS RÁPIDAS */
.qa{display:grid;gap:8px}
.qa details{background:var(--card);border-radius:18px;box-shadow:inset 0 0 0 1px var(--hair);transition:box-shadow .3s}
.qa details[open]{box-shadow:inset 0 0 0 1.5px var(--blue)}
.qa summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 16px 16px 18px;font-size:16.5px;font-weight:600;line-height:1.3}
.qa summary::-webkit-details-marker{display:none}
.qa summary i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-style:normal;font-size:18px;line-height:1;color:var(--ink);transition:transform .35s var(--bounce),background .3s}
.qa details[open] summary i{transform:rotate(45deg);background:var(--blue);color:#fff}
.qa .ans{padding:0 18px 16px;font-size:15.5px;line-height:1.5;color:var(--muted)}
.qa-hint{font-size:13px;color:var(--muted);margin:-4px 0 12px}

/* AGORA */
.now{display:grid;gap:10px}
.nw{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:14px 16px 14px 14px;color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair);transition:transform .35s var(--bounce)}
a.nw:hover{transform:translateY(-2px)}
.nw2{display:grid;gap:14px;padding:18px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 1px var(--hair);color:var(--ink);transition:transform .35s var(--bounce)}
.nw2.feat{background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;border:1.5px solid transparent;box-shadow:0 20px 40px -26px rgba(94,92,230,.55)}
a.nw2:hover{transform:translateY(-2px);text-decoration:none}
.nh{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center}
.nh .lg{width:52px;height:52px;border-radius:14px;overflow:hidden;background:#fff;display:grid;place-items:center}
.nh .lg img{width:100%;height:100%;object-fit:cover;display:block}
.nh b{display:block;font-size:17.5px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.nh small{display:block;font-size:14px;color:var(--muted);line-height:1.35;margin-top:2px}
.nh .go{color:var(--muted);font-size:24px;line-height:1}
.nf{display:flex;flex-wrap:wrap;gap:6px}
.nf span{font-size:13px;font-weight:600;color:var(--ink);background:var(--soft);border-radius:980px;padding:5px 11px}
.np{display:grid;gap:7px}
.npb{height:8px;border-radius:6px;background:var(--soft);overflow:hidden}
.npb i{display:block;height:100%;transform-origin:0 50%;transform:scaleX(var(--p,0));background:var(--grad);border-radius:6px}
.np span{font-size:13px;color:var(--muted)}
.np span b{color:var(--ink);font-weight:700}
.lv{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.lv span{position:relative;display:grid;justify-items:center;gap:1px;font-size:13px;font-weight:600;padding:8px 0 7px;border-radius:10px;background:var(--soft);color:var(--muted)}
.lv .goal{background:var(--grad);color:#fff}
.lv em{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.ncta{font-size:14.5px;font-weight:600;color:var(--blue)}
.nw .em{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:22px}
.nw b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.nw small{display:block;font-size:13.5px;color:var(--muted);line-height:1.35;margin-top:1px}
.nw .go{color:var(--muted);font-size:20px}

/* ALÉM DO TRABALHO */
.fun{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{background:var(--card);border-radius:20px;padding:18px 16px;display:grid;gap:6px;align-content:start;box-shadow:inset 0 0 0 1px var(--hair);transition:transform .35s var(--bounce)}
.fc:hover{transform:translateY(-3px) rotate(-1deg)}
/* Além do trabalho: cada interesse com uma cor própria, quente e diferente do azul/roxo do resto da página */
.fun .fc{--c:48,209,88;background:radial-gradient(130% 120% at 0% 0%,rgba(var(--c),.22),transparent 60%),var(--card);box-shadow:inset 0 0 0 1px rgba(var(--c),.35)}
.fun .fc:nth-child(2){--c:255,159,10}
.fun .fc:nth-child(3){--c:255,69,58}
.fun .fc:nth-child(4){--c:255,214,10}
.fun .fc .em{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:rgba(var(--c),.18)}
.fun .fc b{color:rgb(var(--c))}
.fun .fc span:not(.em){color:var(--ink);opacity:.78}
.fc .em{font-size:30px;line-height:1}
.fc b{font-size:16px;font-weight:600;line-height:1.25}
.fc span{font-size:14px;color:var(--muted);line-height:1.4}

/* LINKS */
.cta{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:18px;font-size:16.5px;font-weight:600;transition:transform .35s var(--bounce),background .2s}
.btn:hover{transform:translateY(-2px);text-decoration:none}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn.main{background:var(--btn);color:var(--btn-ink)}
.btn.li{background:#0a66c2;color:#fff}
.btn.wa{background:#25d366;color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}

footer{margin-top:36px;text-align:center;font-size:12.5px;color:var(--muted)}
.draft-bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:9;background:#2a1f0a;color:var(--todo);border:1px solid rgba(255,159,10,.4);border-radius:980px;padding:7px 14px;font-size:12.5px;font-weight:600;box-shadow:0 10px 30px -12px rgba(0,0,0,.3);white-space:nowrap}

/* MOVIMENTO */
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(.55em) rotate(8deg)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes hop{0%,100%{transform:none}35%{transform:translateY(-10px) rotate(-8deg) scale(1.15)}65%{transform:translateY(0) rotate(4deg)}}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@keyframes fillx{from{transform:scaleX(0)}to{transform:scaleX(var(--p,0))}}
@keyframes fillbar{from{transform:scaleX(0)}to{transform:none}}
@keyframes swap{from{opacity:0;transform:translateY(60%)}to{opacity:1;transform:none}}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{0%,60%,100%{transform:none}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glowA{to{transform:translate(-60px,50px) scale(1.1)}}
@keyframes glowB{to{transform:translate(70px,-40px) scale(1.08)}}
@media (prefers-reduced-motion:no-preference){
  html{scroll-behavior:smooth}
  .bg::before{animation:glowA 13s ease-in-out infinite alternate}
  .bg::after{animation:glowB 16s ease-in-out infinite alternate}
  .photo::before{animation:spin 8s linear infinite}
  .photo{animation:up .8s var(--out) both,float 6s 1s ease-in-out infinite}
  .hi h1{animation:up .8s .12s var(--out) both}
  .hi .intro{animation:up .8s .24s var(--out) both}
  .wave{animation:wave 2.4s .8s ease-in-out 2}
  .rv{animation:up .7s var(--out) both;animation-delay:calc(.35s + var(--d,0s))}
  .story::before{animation:grow 1.4s var(--out) .5s both}
  .npb i{animation:fillx 1.4s var(--out) .8s both}
  .lv .goal{animation:pop .6s var(--bounce) 1s both}
  .hi h1{animation:none}
  .hi h1 .ch{animation:rise .7s var(--out) both;animation-delay:calc(.15s + var(--i) * 30ms)}
  .today .where span{animation:pop .5s var(--bounce) both;animation-delay:calc(.9s + var(--i,0) * 90ms)}
  .fc:hover .em,.fc:active .em{animation:hop .6s var(--bounce)}
  .btn.sb::after{animation:shine 3.4s ease-in-out 2s infinite}
  @supports (animation-timeline: view()){
    main > section:not(.hi).rv,main section .rv{animation:up linear both;animation-timeline:view();animation-range:entry 0% entry 55%;animation-delay:0s}
  }
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:360px){.fun{grid-template-columns:1fr}}

        ${a.meta ? `<div class="lv" aria-label="Meta: nível ${esc(a.meta)}">${["A1", "A2", "B1", "B2", "C1", "C2"].map(n => `<span${n === a.meta ? ' class="goal"' : ""}>${n}${n === a.meta ? "<em>meta</em>" : ""}</span>`).join("")}</div>` : ""}
        ${a.cta ? `<span class="ncta">${fmt(a.cta)} ›</span>` : ""}
      </${tag}>`; }).join("")}</div>
  </section>` : ""}

  ${alem.length ? `<section aria-labelledby="h-fun">
    <p class="label rv" id="h-fun">Além do trabalho</p>
    <div class="fun">${alem.map((a, i) => `<div class="fc rv" style="--d:${(i % 2) * 80}ms"><span class="em" aria-hidden="true">${fmt(a.emoji)}</span><b>${fmt(a.titulo)}</b>${filled(a.texto) ? `<span>${fmt(a.texto)}</span>` : ""}</div>`).join("")}</div>
  </section>` : ""}

  <section aria-labelledby="h-cta">
    <p class="label rv" id="h-cta">Quer saber mais?</p>
    <div class="cta">
      <a class="btn sb rv" href="${esc(e.projeto.url)}" target="_blank" rel="noopener">Smart Balcão, meu projeto</a>
      <a class="btn main rv" style="--d:40ms" href="${esc(e.portfolio)}" target="_blank" rel="noopener">${BAG}Meu portfólio profissional</a>
      <a class="btn li rv" style="--d:70ms" href="${esc(e.linkedin)}" target="_blank" rel="noopener">${LI}Me chama no LinkedIn</a>
      ${temWa ? `<a class="btn wa rv" style="--d:140ms" href="${/^https?:/.test(strip(e.whatsapp)) ? esc(strip(e.whatsapp)) : "#"}" target="_blank" rel="noopener">${WA}${DRAFT && !/^https?:/.test(strip(e.whatsapp)) ? fmt(e.whatsapp) : "Me chama no WhatsApp"}</a>` : ""}
    </div>
  </section>

  <footer><a href="https://humbertoanastacio.github.io/">humbertoanastacio.github.io</a></footer>`;

(() => {
  if (!matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  document.addEventListener("pointermove", ev => {
    const el = ev.target.closest && ev.target.closest(".today, .nw, .fc"); if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty("--mx", (ev.clientX - r.left) + "px"); el.style.setProperty("--my", (ev.clientY - r.top) + "px");
  }, { passive: true });
})();

(() => {
  const sv = document.getElementById("sv"); if (!sv) return;
  const frame = document.getElementById("svFrame"), media = document.getElementById("svMedia"), bars = document.getElementById("svBars");
  const av = document.getElementById("svAv"), nm = document.getElementById("svName"), wh = document.getElementById("svWhen"), body = document.getElementById("svBody");
  const T = e.trajetoria, auto = !matchMedia("(prefers-reduced-motion: reduce)").matches, DUR = 6500;
  const segs = t => (t.fotos && t.fotos.length) ? t.fotos : [null];
  let s = 0, k = 0, timer = 0, startAt = 0, left = DUR, last = null, pushed = false;
  const render = () => {
    const t = T[s], list = segs(t), foto = list[k];
    frame.style.setProperty("--sv-bg", `radial-gradient(120% 80% at 50% 25%, ${t.cor}, #0b0b0d 75%)`);
    media.innerHTML = foto ? `<img src="${esc(foto)}" alt="">` : `<span class="sv-logo"><img src="${t.logo}" alt=""></span>`;
    bars.innerHTML = list.map((_, i) => `<i class="${i < k ? "done" : i === k ? "cur" : ""}"><b></b></i>`).join("");
    av.innerHTML = `<img src="${t.logo}" alt="">`; nm.textContent = t.empresa; wh.textContent = t.periodo;
    body.innerHTML = `<span class="cg">${fmt(t.cargo)}</span><h3>${fmt(t.titulo)}</h3><p>${fmt(t.texto)}</p>${t.destaque ? `<span class="st"><b>${fmt(t.destaque)}</b><span>${fmt(t.destaqueRotulo)}</span></span>` : ""}`;
    frame.classList.remove("sv-anim"); void frame.offsetWidth; frame.classList.add("sv-anim");
    const cur = bars.querySelector(".cur"); if (cur) cur.style.setProperty("--t", DUR + "ms");
    if (!auto && cur) cur.className = "done";
    schedule(DUR);
  };
  const schedule = ms => { clearTimeout(timer); if (!auto) return; left = ms; startAt = performance.now(); timer = setTimeout(next, ms); };
  const next = () => { if (k < segs(T[s]).length - 1) k++; else if (s < T.length - 1) { s++; k = 0; } else return close(); render(); };
  const prev = () => { if (k > 0) k--; else if (s > 0) { s--; k = segs(T[s]).length - 1; } else k = 0; render(); };
  const open = i => {
    last = document.activeElement; s = i; k = 0; sv.hidden = false; document.body.style.overflow = "hidden";
    if (!pushed) { try { history.pushState({ sv: 1 }, "", "#trajetoria"); pushed = true; } catch {} }
    render(); document.getElementById("svClose").focus();
  };
  const hide = () => { clearTimeout(timer); sv.hidden = true; document.body.style.overflow = ""; if (last) last.focus(); };
  const close = () => { if (pushed) { pushed = false; try { history.back(); return; } catch {} } hide(); };
  addEventListener("popstate", () => { if (!sv.hidden) { pushed = false; hide(); } });
  document.querySelectorAll("[data-story]").forEach(b => b.addEventListener("click", () => open(+b.dataset.story)));
  document.getElementById("svNext").addEventListener("click", next);
  document.getElementById("svPrev").addEventListener("click", prev);
  document.getElementById("svClose").addEventListener("click", close);
  sv.addEventListener("click", ev => { if (ev.target === sv) close(); });
  document.addEventListener("keydown", ev => { if (sv.hidden) return; if (ev.key === "Escape") close(); if (ev.key === "ArrowRight") next(); if (ev.key === "ArrowLeft") prev(); });
  const pause = on => {
    if (!auto) return;
    frame.classList.toggle("paused", on);
    if (on) { clearTimeout(timer); left = Math.max(300, left - (performance.now() - startAt)); } else schedule(left);
  };
  frame.addEventListener("pointerdown", ev => { if (!ev.target.closest(".sv-x")) pause(true); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(n => frame.addEventListener(n, () => frame.classList.contains("paused") && pause(false)));
  let y0 = null;
  frame.addEventListener("touchstart", ev => { y0 = ev.touches[0].clientY; }, { passive: true });
  frame.addEventListener("touchend", ev => { if (y0 !== null && ev.changedTouches[0].clientY - y0 > 90) close(); y0 = null; }, { passive: true });
  if (location.hash === "#trajetoria") { history.replaceState(null, "", location.pathname + location.search); open(0); }
})();

(() => {
  const box = document.getElementById("stories"); if (!box) return;
  const slides = [...box.querySelectorAll(".slide")], bars = [...box.querySelectorAll(".sbars i")], wrap = box.querySelector(".sbars");
  const auto = !matchMedia("(prefers-reduced-motion: reduce)").matches, T = 5000;
  let i = 0, timer = 0;
  const show = n => {
    i = (n + slides.length) % slides.length;
    slides.forEach((s, k) => { s.classList.toggle("on", k === i); s.setAttribute("aria-hidden", k === i ? "false" : "true"); });
    bars.forEach((b, k) => { b.className = k < i ? "done" : ""; });
    if (auto) { void bars[i].offsetWidth; bars[i].className = "cur"; bars[i].style.setProperty("--t", T + "ms"); clearTimeout(timer); timer = setTimeout(() => show(i + 1), T); }
    else bars[i].className = "done";
  };
  box.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => show(i + +b.dataset.go)));
  box.addEventListener("keydown", ev => { if (ev.key === "ArrowRight") show(i + 1); if (ev.key === "ArrowLeft") show(i - 1); });
  const pause = on => { wrap.classList.toggle("paused", on); if (on) clearTimeout(timer); else if (auto) { const left = T * (1 - (bars[i].querySelector("b").getBoundingClientRect().width / bars[i].getBoundingClientRect().width || 0)); timer = setTimeout(() => show(i + 1), left); } };
  box.addEventListener("pointerdown", () => pause(true)); box.addEventListener("pointerup", () => pause(false)); box.addEventListener("pointerleave", () => wrap.classList.contains("paused") && pause(false));
  show(0);
})();

(() => {
  const w = document.getElementById("word"); if (!w || sou.length < 2) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let i = 0;
  setInterval(() => { i = (i + 1) % sou.length; w.innerHTML = fmt(sou[i]); w.classList.remove("swap"); void w.offsetWidth; w.classList.add("swap"); }, 2200);
})();

if (DRAFT) document.body.insertAdjacentHTML("beforeend", '<p class="draft-bar" role="status">Rascunho: campos a preencher visíveis</p>');
